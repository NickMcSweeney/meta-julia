# meta-julia/conf/layer.conf
# Layer configuration for meta-julia

LCONF_VERSION = "7"

# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "julia"
BBFILE_PATTERN_julia = "^${LAYERDIR}/"
BBFILE_PRIORITY_julia = "5"
LAYERVERSION_julia = "1"

LAYERSERIES_COMPAT_julia = "kirkstone"

